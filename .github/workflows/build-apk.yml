name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Unzip project
        run: unzip -q TVCleaner.zip
      - name: Build debug APK
        working-directory: TVCleaner
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: TVCleaner-debug-apk
          path: TVCleaner/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
